<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADIRUL - Pertanian & Penternakan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo-link">
        <img src="images/logo.svg" alt="ADIRUL Logo" class="brand-logo-img">
      </a>

      <button class="mobile-toggle" aria-label="Toggle navigation menu" onclick="toggleMenu()">
        ☰
      </button>

      <nav>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html" class="nav-link active">HOME</a></li>
          <li><a href="pertanian.html" class="nav-link">PERTANIAN</a></li>
          <li><a href="penternakan.html" class="nav-link">PENTERNAKAN</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <!-- Hero / Main Introduction Section -->
    <section class="hero-section">
      <div class="hero-logo-wrapper">
        <img src="images/logo.svg" alt="ADIRUL Emblem">
      </div>
      <h1 class="hero-title">ADIRUL</h1>
      <p class="hero-subtitle">PERTANIAN & PENTERNAKAN</p>
      <p class="hero-intro">
        Menawarkan pilihan hasil pertanian dan penternakan dengan maklumat yang mudah diakses.
      </p>
    </section>

    <!-- Main Homepage Choices Section -->
    <section class="container">
      <div class="home-choices-grid">

        <!-- LEFT SECTION: AGRICULTURE -->
        <div class="choice-card">
          <div class="choice-image-container">
            <img src="images/pertanian-hero.jpg" alt="Pertanian ADIRUL">
          </div>
          <div class="choice-content">
            <a href="pertanian.html" class="choice-link">PERTANIAN</a>
          </div>
        </div>

        <!-- RIGHT SECTION: LIVESTOCK -->
        <div class="choice-card">
          <div class="choice-image-container">
            <img src="images/penternakan-hero.jpg" alt="Penternakan ADIRUL">
          </div>
          <div class="choice-content">
            <a href="penternakan.html" class="choice-link">PENTERNAKAN</a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">ADIRUL</div>
      <div class="footer-tagline">PERTANIAN & PENTERNAKAN</div>
      <div class="footer-copyright">
        © 2026 ADIRUL. All Rights Reserved.
      </div>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('navMenu');
      menu.classList.toggle('active');
    }
  </script>
</body>
</html>
